custom_rules:
  avoid_force_cast:
    name: "강제 캐스팅 금지"
    regex: "as!"
    message: "⚠️ 강제 캐스팅 (as!)은 앱 크래시를 유발할 수 있습니다. optional binding을 사용하세요."
    severity: warning

  avoid_force_unwrap:
    name: "강제 언래핑 금지"
    regex: "\\)!"        # 대부분의 강제 언래핑에 대응
    message: "⚠️ 강제 언래핑 (!)은 앱 크래시를 유발할 수 있습니다. guard let 또는 if let을 사용하세요."
    severity: warning
    
  count_equal_zero:
    name: "빈 배열 비교는 isEmpty를 사용"
    regex: "\\.count\\s*==\\s*0"
    message: "⚠️ .count == 0 보다는 .isEmpty를 사용하는 것이 좋습니다."
    severity: warning
    
  class_name_should_start_with_uppercase:
    name: "클래스 이름은 대문자로 시작해야 합니다"
    regex: "\\bclass\\s+[a-z]"
    message: "⚠️ 클래스 이름은 대문자로 시작해야 합니다. 예: MyClass"
    severity: warning

  function_name_should_start_with_lowercase:
    name: "함수 이름은 소문자로 시작해야 합니다"
    regex: "\\bfunc\\s+[A-Z]"
    message: "⚠️ 함수 이름은 소문자로 시작해야 합니다. 예: doSomething"
    severity: warning
